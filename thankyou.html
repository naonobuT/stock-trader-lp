<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご購入ありがとうございます | 株トレシミュレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0e1a; --bg2:#111827; --bg3:#1a2236;
      --border:#2a3550; --text:#e8eaf0; --text2:#8892a4;
      --accent:#f59e0b; --green:#10b981;
    }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
    }
    nav {
      background:rgba(10,14,26,0.92); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      padding:0 24px; height:56px;
      display:flex; align-items:center;
    }
    .nav-logo { font-size:14px; font-weight:800; color:var(--text); text-decoration:none; }
    main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:40px 24px;
    }
    .card {
      background:var(--bg2); border:1px solid var(--border);
      border-radius:16px; padding:48px 40px; max-width:520px; width:100%;
      text-align:center;
    }
    .icon {
      width:64px; height:64px; background:rgba(16,185,129,0.15);
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      margin:0 auto 24px; font-size:28px;
    }
    h1 { font-size:22px; font-weight:800; margin-bottom:16px; }
    .lead {
      font-size:15px; color:var(--text2); line-height:1.9; margin-bottom:32px;
    }
    .lead strong { color:var(--text); }
    .steps {
      background:var(--bg3); border-radius:10px;
      padding:20px 24px; text-align:left; margin-bottom:32px;
    }
    .steps p { font-size:13px; color:var(--text2); margin-bottom:4px; font-weight:600; }
    .steps ol { padding-left:18px; }
    .steps li { font-size:13px; color:var(--text2); line-height:1.9; }
    .btn {
      display:inline-block; padding:12px 28px;
      background:var(--accent); border-radius:8px;
      color:#000; font-size:14px; font-weight:700;
      text-decoration:none; transition:opacity 0.15s;
    }
    .btn:hover { opacity:0.85; }
    .note { margin-top:20px; font-size:12px; color:var(--text2); }
    .note a { color:var(--text2); }
    footer {
      border-top:1px solid var(--border); padding:24px;
      text-align:center; font-size:12px; color:var(--text2);
    }
    footer a { color:var(--text2); text-decoration:none; margin:0 10px; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">■ 株トレシミュレーター</a>
</nav>

<main>
  <div class="card">
    <div class="icon">✓</div>
    <h1>ご購入ありがとうございます</h1>
    <p class="lead">
      数分以内に<strong>ご登録のメールアドレス</strong>に<br>
      ライセンスキーとダウンロードリンクをお送りします。
    </p>

    <div class="steps">
      <p>次のステップ</p>
      <ol>
        <li>メールボックスをご確認ください（迷惑メールフォルダもご確認ください）</li>
        <li>メール内のリンクからアプリをダウンロード</li>
        <li>アプリを起動してライセンスキーを入力</li>
        <li>J-Quants から株価データを取得して練習開始</li>
      </ol>
    </div>

    <a class="btn" href="index.html">トップページへ戻る</a>

    <p class="note">
      メールが届かない場合は <a href="mailto:fukushino.youmade@gmail.com">こちら</a> までお問い合わせください。
    </p>
  </div>
</main>

<footer>
  <a href="index.html">トップ</a>
  <a href="support.html">サポート</a>
  <a href="mailto:fukushino.youmade@gmail.com">お問い合わせ</a>
</footer>

</body>
</html>
